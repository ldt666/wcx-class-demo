<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 元旦倒计时 · 金羊贺岁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #c0392b 0%, #8f1d18 45%, #5c0f0c 100%);
    color: #ffe9c7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ===== 灯笼 ===== */
  .lantern {
    position: absolute;
    top: -8px;
    width: 90px;
    text-align: center;
    z-index: 2;
    animation: sway 4s ease-in-out infinite;
    transform-origin: top center;
    user-select: none;
  }
  .lantern .rope { width: 2px; height: 45px; background: #ffd27a; margin: 0 auto; }
  .lantern .cap {
    width: 40px; height: 12px; margin: 0 auto;
    background: linear-gradient(#ffd27a, #e0a23a);
    border-radius: 4px;
  }
  .lantern .body {
    width: 80px; height: 62px; margin: 0 auto;
    background: radial-gradient(circle at 50% 45%, #ff6b52, #d62828 70%);
    border-radius: 50% / 46%;
    box-shadow: inset 0 -6px 14px rgba(120,0,0,.55), 0 6px 22px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .lantern .body::before {
    content: "福";
    font-size: 30px;
    color: #ffe9c7;
    font-weight: bold;
    text-shadow: 0 0 6px rgba(255, 230, 150, .9);
  }
  .lantern .tassel {
    width: 6px; height: 30px; margin: 0 auto;
    background: linear-gradient(#e0a23a, #ff6b52, transparent);
    border-radius: 3px;
  }
  .lantern.left  { left: 6%; animation-delay: 0s; }
  .lantern.right { right: 6%; animation-delay: 1.6s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(4deg); }
  }

  /* 飘落元素 */
  .float-item {
    position: absolute;
    top: -60px;
    font-size: 26px;
    opacity: .8;
    animation: fall linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(360deg); }
  }

  /* ===== 主内容 ===== */
  .main {
    z-index: 5;
    text-align: center;
    padding: 20px;
  }

  .year-badge {
    display: inline-block;
    padding: 8px 34px;
    border: 2px solid rgba(255, 215, 130, .8);
    border-radius: 999px;
    background: rgba(255, 255, 255, .06);
    font-size: 16px;
    letter-spacing: 6px;
    color: #ffd98a;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
  }

  h1 {
    font-size: clamp(34px, 7vw, 68px);
    color: #ffd98a;
    letter-spacing: 8px;
    text-shadow: 0 2px 0 #a3261c, 0 4px 18px rgba(0,0,0,.5);
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: clamp(14px, 2.4vw, 20px);
    letter-spacing: 10px;
    color: #ffb1a0;
    margin-bottom: 34px;
  }

  /* ===== 倒计时 ===== */
  .countdown {
    display: flex;
    gap: clamp(10px, 3vw, 30px);
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .unit {
    background: linear-gradient(160deg, rgba(255, 120, 90, .18), rgba(120, 10, 8, .35));
    border: 1px solid rgba(255, 200, 140, .45);
    border-radius: 18px;
    padding: 18px 10px 14px;
    min-width: clamp(86px, 16vw, 150px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.15);
    backdrop-filter: blur(6px);
  }

  .unit .num {
    font-family: "Consolas", "Menlo", monospace;
    font-size: clamp(38px, 8vw, 74px);
    font-weight: bold;
    color: #fff4d6;
    text-shadow: 0 0 14px rgba(255, 190, 110, .75), 0 3px 0 #9c1f16;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .unit .label {
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: 5px;
    color: #ffbe93;
  }

  /* ===== 小羊 ===== */
  .sheep-zone {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 26px;
    margin-top: 6px;
  }

  .sheep {
    width: 150px;
    animation: bounce 2.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.4));
    user-select: none;
  }
  .sheep.slow {
    animation-duration: 3.4s;
    animation-delay: .6s;
    width: 120px;
    opacity: .95;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-14px) rotate(-2deg); }
    60%      { transform: translateY(-4px) rotate(2deg); }
  }

  .greeting {
    margin-top: 30px;
    font-size: clamp(15px, 2.6vw, 21px);
    letter-spacing: 4px;
    color: #ffd0ad;
    line-height: 1.9;
  }
  .greeting .hl {
    color: #ffe28a;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255, 200, 100, .6);
  }

  .arrived {
    display: none;
    font-size: clamp(30px, 6vw, 60px);
    color: #ffe28a;
    letter-spacing: 10px;
    text-shadow: 0 0 20px rgba(255, 200, 100, .8);
    animation: pulse 1.2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  .footer-tip {
    position: absolute;
    bottom: 16px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(255, 200, 160, .55);
    z-index: 4;
  }

  @media (max-width: 560px) {
    .lantern { width: 62px; }
    .lantern .body { width: 54px; height: 44px; }
    .lantern .body::before { font-size: 20px; }
  }
</style>
</head>
<body>

  <!-- 灯笼 -->
  <div class="lantern left">
    <div class="rope"></div><div class="cap"></div><div class="body"></div><div class="tassel"></div>
  </div>
  <div class="lantern right">
    <div class="rope"></div><div class="cap"></div><div class="body"></div><div class="tassel"></div>
  </div>

  <div class="main">
    <div class="year-badge">羊年迎新 · 2027</div>
    <h1>距离 2027 年元旦</h1>
    <div class="subtitle">— 金羊贺岁 · 三阳开泰 —</div>

    <div class="arrived" id="arrived">🎉 元旦快乐 · 羊年大吉 🎉</div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="dd">--</div><div class="label">天</div></div>
      <div class="unit"><div class="num" id="hh">--</div><div class="label">时</div></div>
      <div class="unit"><div class="num" id="mm">--</div><div class="label">分</div></div>
      <div class="unit"><div class="num" id="ss">--</div><div class="label">秒</div></div>
    </div>

    <div class="sheep-zone">
      <!-- 小羊 1 -->
      <svg class="sheep slow" viewBox="0 0 210 175" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="108" rx="62" ry="48" fill="#fff7ea"/>
        <circle cx="58"  cy="92"  r="26" fill="#fff7ea"/>
        <circle cx="100" cy="75"  r="28" fill="#fff7ea"/>
        <circle cx="142" cy="92"  r="26" fill="#fff7ea"/>
        <circle cx="100" cy="132" r="30" fill="#f7ead2"/>
        <path d="M75 120 Q100 140 125 120 L127 134 Q100 154 73 134 Z" fill="#d62828"/>
        <ellipse cx="152" cy="72" rx="30" ry="26" fill="#3a2a26"/>
        <ellipse cx="128" cy="64" rx="14" ry="8" fill="#3a2a26" transform="rotate(-25 128 64)"/>
        <circle cx="145" cy="46" r="12" fill="#fff7ea"/>
        <circle cx="158" cy="44" r="11" fill="#fff7ea"/>
        <circle cx="169" cy="52" r="9"  fill="#fff7ea"/>
        <circle cx="156" cy="68" r="4.5" fill="#ffffff"/>
        <circle cx="157" cy="69" r="2.4" fill="#1b1b1b"/>
        <ellipse cx="166" cy="80" rx="6" ry="3.5" fill="#ff9d8a" opacity=".85"/>
        <circle cx="172" cy="74" r="2.6" fill="#ff8f80"/>
        <path d="M170 80 q4 4 8 0" stroke="#f5d5b5" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="70"  y="140" width="14" height="34" rx="6" fill="#3a2a26"/>
        <rect x="115" y="140" width="14" height="34" rx="6" fill="#3a2a26"/>
        <path d="M66 170 l-6 6 M74 170 l6 6 M111 170 l-6 6 M119 170 l6 6" stroke="#e8c9a0" stroke-width="2" stroke-linecap="round"/>
      </svg>

      <!-- 小羊 2 -->
      <svg class="sheep" viewBox="0 0 210 175" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="108" rx="62" ry="48" fill="#fffdf6"/>
        <circle cx="58"  cy="92"  r="26" fill="#fffdf6"/>
        <circle cx="100" cy="75"  r="28" fill="#fffdf6"/>
        <circle cx="142" cy="92"  r="26" fill="#fffdf6"/>
        <circle cx="100" cy="132" r="30" fill="#f3e6cf"/>
        <path d="M75 120 Q100 140 125 120 L127 134 Q100 154 73 134 Z" fill="#c8102e"/>
        <rect x="118" y="130" width="13" height="26" rx="4" fill="#a30d25" transform="rotate(12 124 143)"/>
        <ellipse cx="152" cy="72" rx="30" ry="26" fill="#2e211d"/>
        <ellipse cx="128" cy="64" rx="14" ry="8" fill="#2e211d" transform="rotate(-25 128 64)"/>
        <circle cx="145" cy="46" r="12" fill="#fffdf6"/>
        <circle cx="158" cy="44" r="11" fill="#fffdf6"/>
        <circle cx="169" cy="52" r="9"  fill="#fffdf6"/>
        <circle cx="156" cy="68" r="4.5" fill="#ffffff"/>
        <circle cx="157" cy="69" r="2.4" fill="#1b1b1b"/>
        <ellipse cx="166" cy="80" rx="6" ry="3.5" fill="#ff9d8a" opacity=".85"/>
        <circle cx="172" cy="74" r="2.6" fill="#ff8f80"/>
        <path d="M170 80 q4 4 8 0" stroke="#f5d5b5" stroke-width="2" fill="none" stroke-linecap="round"/>
        <rect x="70"  y="140" width="14" height="34" rx="6" fill="#2e211d"/>
        <rect x="115" y="140" width="14" height="34" rx="6" fill="#2e211d"/>
        <path d="M66 170 l-6 6 M74 170 l6 6 M111 170 l-6 6 M119 170 l6 6" stroke="#e8c9a0" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="greeting">
      咩~~ 小羊祝您：<span class="hl">喜气洋洋迎新年，洋洋得意万事顺</span><br>
      愿新的一年 <span class="hl">喜乐平安 · 财运洋洋</span>
    </div>
  </div>

  <div class="footer-tip">— 2 0 2 7 · 新 年 快 乐 —</div>

<script>
  // ===== 飘落装饰 =====
  (function createFloaters() {
    var symbols = ["🐑", "🏮", "✨", "🎊", "🐑", "🧧"];
    for (var i = 0; i < 14; i++) {
      var el = document.createElement("div");
      el.className = "float-item";
      el.textContent = symbols[i % symbols.length];
      el.style.left = (Math.random() * 96) + "vw";
      el.style.fontSize = (18 + Math.random() * 18) + "px";
      el.style.animationDuration = (9 + Math.random() * 12) + "s";
      el.style.animationDelay = (-Math.random() * 12) + "s";
      document.body.appendChild(el);
    }
  })();

  // ===== 倒计时 =====
  var target = new Date("2027-01-01T00:00:00");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var now = new Date();
    var diff = target - now;

    if (diff <= 0) {
      document.getElementById("countdown").style.display = "none";
      var arr = document.getElementById("arrived");
      arr.style.display = "block";
      return;
    }

    var d = Math.floor(diff / 86400000);
    var h = Math.floor(diff % 86400000 / 3600000);
    var m = Math.floor(diff % 3600000 / 60000);
    var s = Math.floor(diff % 60000 / 1000);

    document.getElementById("dd").textContent = pad(d);
    document.getElementById("hh").textContent = pad(h);
    document.getElementById("mm").textContent = pad(m);
    document.getElementById("ss").textContent = pad(s);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
